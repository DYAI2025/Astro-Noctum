name: Text Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-text-files:
    name: Validate text encodings and file types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check UTF-8 and binary/text mismatches
        run: npm run check:text-integrity
