<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazodiac — Datenflussmodell</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a1a;
    color: #e0e0e0;
    overflow-x: hidden;
  }
  .header {
    text-align: center;
    padding: 32px 20px 16px;
    background: linear-gradient(180deg, #12122a 0%, #0a0a1a 100%);
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #7c6cf0, #50c8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .header p {
    color: #888;
    font-size: 13px;
    max-width: 700px;
    margin: 0 auto;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 12px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #999;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  /* SVG Canvas */
  .canvas-container {
    width: 100%;
    overflow-x: auto;
    padding: 0 20px 40px;
  }
  svg {
    display: block;
    margin: 0 auto;
  }

  /* Node styles */
  .node-group { cursor: pointer; }
  .node-group:hover .node-box { filter: brightness(1.3); }
  .node-group:hover .node-label { fill: #fff; }

  .node-box {
    rx: 8;
    ry: 8;
    transition: filter 0.2s;
  }
  .node-label {
    font-size: 11px;
    font-weight: 600;
    fill: #ddd;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .node-sublabel {
    font-size: 9px;
    fill: #888;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .section-label {
    font-size: 13px;
    font-weight: 700;
    fill: #555;
    text-anchor: middle;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* Flow lines */
  .flow-line {
    fill: none;
    stroke-width: 1.5;
    opacity: 0.35;
    transition: opacity 0.2s, stroke-width 0.2s;
  }
  .flow-line.highlight {
    opacity: 0.85;
    stroke-width: 2.5;
  }
  .flow-line.dim {
    opacity: 0.08;
  }

  /* Weight labels on flows */
  .weight-label {
    font-size: 9px;
    fill: #666;
    text-anchor: middle;
    pointer-events: none;
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    max-width: 320px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip h3 {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    color: #fff;
  }
  .tooltip .detail {
    color: #aaa;
    line-height: 1.5;
  }
  .tooltip .formula {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #7c6cf0;
    background: #12122a;
    padding: 4px 8px;
    border-radius: 4px;
    margin-top: 6px;
    display: block;
  }

  /* Info panel */
  .info-panel {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }
  .info-card {
    background: #12122a;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 16px;
  }
  .info-card h3 {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .info-card p {
    font-size: 11px;
    color: #888;
    line-height: 1.6;
  }
  .info-card code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #7c6cf0;
    background: #0a0a1a;
    padding: 2px 6px;
    border-radius: 3px;
  }
  @media (max-width: 700px) {
    .info-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Bazodiac Datenflussmodell</h1>
  <p>Jede Verbindung zeigt exakt, welche Daten von welcher Quelle durch welche Engine in welches Output fliessen. Hover auf Knoten um Details zu sehen.</p>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#50c8ff"></div>Input-Quellen</div>
  <div class="legend-item"><div class="legend-dot" style="background:#7c6cf0"></div>Berechnungs-Engines</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff6b9d"></div>Zwischen-Produkte</div>

</div>

  <svg id="flowSvg" width="1200" height="1050"></svg>
</div>

  <div class="detail" id="ttDetail"></div>
</div>

<div class="info-panel">
  <div class="info-grid" id="infoGrid"></div>
</div>

  signatur:   { x:890, y:430, w:155, h:54, c:C.output, bg:C.outputBg, label:'Signatur', sub:'Lebendes Gesamtprofil', detail:'Die SIGNATUR ist das Herzstück: 60% Fusion Prior + 40% Quiz Evidence = finales Bazodiac-Profil. Dynamisch — wächst mit jeder Interaktion. Das "Bilderfeld" / multidimensionale Raum.' },
  levi:       { x:890, y:520, w:155, h:46, c:C.output, bg:C.outputBg, label:'Levi (Partnership)', sub:'Signatur × Signatur Matching', detail:'Vergleicht zwei Signaturen:\n• Resonanz (Bedürfnis-Ähnlichkeit)\n• Chemie (Komplementärspannung)\n• Stabilität (Konflikttauglichkeit)\n• Entwicklungsdruck (Schattentrigger)' },
  bazodiacs:  { x:890, y:600, w:155, h:54, c:C.output, bg:C.outputBg, label:'Bazodiacs (12 Karten)', sub:'Profil-Kartenreihe + Skins', detail:'12 Bazodiac-Karten aufgereiht. Größe proportional zur Gewichtung. Jede Karte zeigt: Label, aktuellen State, Kohärenz-Beitrag. Darunter: gesammelte Skin-Trophäen aus Entertainment-Quizzes.' },

// ─── FLOW CONNECTIONS ───
// [from, to, color, weight_label, dash]
const flows = [
  // Geburtsdaten → Engines
  ['birth', 'west_calc', C.input, '', false],
  ['birth', 'east_calc', C.input, '', false],

  // Quiz → Scoring
  ['quiz_v', 'quiz_score', C.input, '', false],
  ['quiz_e', 'quiz_score', C.input, '', false],
  ['quiz_e', 'skins', '#ff6b9d', 'Skins', true],

  // Transit + Cosmic → Transit Engine
  ['transit', 'transit_eng', C.input, '', false],
  ['cosmic', 'transit_eng', C.input, '', false],

  // Western Engine → Products
  ['west_calc', 'signs_west', C.engine, '', false],
  ['west_calc', 'fusion', C.engine, 'West-Teil', false],

  // Bazi Engine → Products

  ['east_calc', 'fusion', C.engine, 'Ost-Teil', false],

  // Fusion → Intermediate Products
  ['fusion', 'baz_prior', C.engine, '', false],
  ['fusion', 'kohaerenz', C.engine, '', false],

  // Quiz Scoring → States + Mismatch
  ['quiz_score', 'baz_state', C.engine, '', false],

  // Prior + State → Mismatch
  ['baz_prior', 'mismatch', '#ff6b9d', '', true],
  ['baz_state', 'mismatch', '#ff6b9d', '', true],

  ['transit_eng', 'transit_hit', C.engine, '', false],

  // Geburtschart → Transit Engine (Natal-Basis)
  ['signs_west', 'transit_eng', '#ff6b9d', 'Natal', true],

  // ── To OUTPUTS ──

  // Tageshoroskop (complex — multiple inputs)
  ['baz_prior', 'tageshor', '#ff6b9d', '60%', false],
  ['baz_state', 'tageshor', '#ff6b9d', '40%', false],
  ['transit_hit', 'tageshor', C.middle, 'Trigger', false],
  ['cosmic', 'tageshor', C.input, 'Events', true],

  ['baz_prior', 'blueprint', '#ff6b9d', '', false],

// ─── RENDER FUNCTIONS ───

function createNode(id, n) {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'node-group');
  g.setAttribute('data-id', id);

  const rect = document.createElementNS(NS, 'rect');
  rect.setAttribute('x', n.x);
  rect.setAttribute('y', n.y);
  rect.setAttribute('width', n.w);
  rect.setAttribute('height', n.h);
  rect.setAttribute('fill', n.bg);
  rect.setAttribute('stroke', n.c);
  rect.setAttribute('stroke-width', '1.5');
  rect.setAttribute('class', 'node-box');
  g.appendChild(rect);

  const text = document.createElementNS(NS, 'text');
  text.setAttribute('x', n.x + n.w / 2);
  text.setAttribute('y', n.y + (n.sub ? n.h / 2 - 7 : n.h / 2));
  text.setAttribute('class', 'node-label');
  text.textContent = n.label;
  g.appendChild(text);

  if (n.sub) {
    const sub = document.createElementNS(NS, 'text');
    sub.setAttribute('x', n.x + n.w / 2);
    sub.setAttribute('y', n.y + n.h / 2 + 9);
    sub.setAttribute('class', 'node-sublabel');
    sub.textContent = n.sub;
    g.appendChild(sub);
  }

  return g;
}

function getPort(nodeId, side) {
  const n = nodes[nodeId];
  if (side === 'right') return { x: n.x + n.w, y: n.y + n.h / 2 };
  if (side === 'left') return { x: n.x, y: n.y + n.h / 2 };
  return { x: n.x + n.w / 2, y: n.y + n.h / 2 };
}

function createFlow(fromId, toId, color, weightLabel, dashed) {
  const from = getPort(fromId, 'right');
  const to = getPort(toId, 'left');

  const midX = (from.x + to.x) / 2;

  const path = document.createElementNS(NS, 'path');
  const d = `M${from.x},${from.y} C${midX},${from.y} ${midX},${to.y} ${to.x},${to.y}`;
  path.setAttribute('d', d);
  path.setAttribute('class', 'flow-line');
  path.setAttribute('stroke', color);
  path.setAttribute('data-from', fromId);
  path.setAttribute('data-to', toId);
  if (dashed) path.setAttribute('stroke-dasharray', '4,3');

  const g = document.createElementNS(NS, 'g');
  g.appendChild(path);

  if (weightLabel) {
    const lx = midX;
    const ly = (from.y + to.y) / 2 - 8;
    const text = document.createElementNS(NS, 'text');
    text.setAttribute('x', lx);
    text.setAttribute('y', ly);
    text.setAttribute('class', 'weight-label');
    text.textContent = weightLabel;
    g.appendChild(text);
  }

  return g;
}

// ─── Section labels ───
function addSectionLabel(text, x, y) {
  const el = document.createElementNS(NS, 'text');
  el.setAttribute('x', x);
  el.setAttribute('y', y);
  el.setAttribute('class', 'section-label');
  el.textContent = text;
  svg.appendChild(el);
}

addSectionLabel('INPUTS', 135, 30);
addSectionLabel('ENGINES', 420, 30);
addSectionLabel('ZWISCHEN', 695, 15);
addSectionLabel('OUTPUTS', 967, 15);

// ─── Render flows first (behind nodes) ───
const flowGroup = document.createElementNS(NS, 'g');
flowGroup.setAttribute('id', 'flowGroup');
flows.forEach(([from, to, color, wl, dash]) => {
  flowGroup.appendChild(createFlow(from, to, color, wl, dash));
});
svg.appendChild(flowGroup);

// ─── Render nodes ───
const nodeGroup = document.createElementNS(NS, 'g');
nodeGroup.setAttribute('id', 'nodeGroup');
Object.entries(nodes).forEach(([id, n]) => {
  nodeGroup.appendChild(createNode(id, n));
});
svg.appendChild(nodeGroup);

// ─── INTERACTIVITY ───

function getConnectedIds(nodeId) {
  const connected = new Set([nodeId]);
  flows.forEach(([from, to]) => {
    if (from === nodeId) connected.add(to);
    if (to === nodeId) connected.add(from);
  });
  return connected;
}

document.querySelectorAll('.node-group').forEach(g => {
  g.addEventListener('mouseenter', (e) => {
    const id = g.getAttribute('data-id');
    const n = nodes[id];
    const connected = getConnectedIds(id);

    // Highlight connected flows
    document.querySelectorAll('.flow-line').forEach(f => {
      const from = f.getAttribute('data-from');
      const to = f.getAttribute('data-to');
      if (from === id || to === id) {
        f.classList.add('highlight');
        f.classList.remove('dim');
      } else {
        f.classList.add('dim');
        f.classList.remove('highlight');
      }
    });

    // Dim unconnected nodes
    document.querySelectorAll('.node-group').forEach(ng => {
      const nid = ng.getAttribute('data-id');
      if (!connected.has(nid)) {
        ng.style.opacity = '0.25';
      }
    });

    // Show tooltip
    const detail = n.detail.replace(/\n/g, '<br>').replace(/•/g, '&bull;');
    document.getElementById('ttTitle').textContent = n.label;
    document.getElementById('ttDetail').innerHTML = detail;

    const rect = g.getBoundingClientRect();
    tooltip.style.left = (rect.right + 12) + 'px';
    tooltip.style.top = (rect.top - 10) + 'px';

    // Keep tooltip on screen
    const ttRect = tooltip.getBoundingClientRect();
    if (ttRect.right > window.innerWidth - 20) {
      tooltip.style.left = (rect.left - ttRect.width - 12) + 'px';
    }
    if (ttRect.bottom > window.innerHeight - 20) {
      tooltip.style.top = (window.innerHeight - ttRect.height - 20) + 'px';
    }

    tooltip.classList.add('visible');
  });

  g.addEventListener('mouseleave', () => {
    document.querySelectorAll('.flow-line').forEach(f => {
      f.classList.remove('highlight', 'dim');
    });
    document.querySelectorAll('.node-group').forEach(ng => {
      ng.style.opacity = '1';
    });
    tooltip.classList.remove('visible');
  });
});
