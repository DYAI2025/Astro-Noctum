<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazodiac Signatur V3 — Bipolar Trail Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050308;
    color: #c8c0d8;
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    border-radius: 50%;
    background: radial-gradient(ellipse at center, #0d0a1a 0%, #050308 100%);
  }
  #controls {
    width: 280px;
    padding: 20px 16px;
    background: rgba(15, 12, 25, 0.95);
    border-left: 1px solid rgba(255,255,255,0.06);
    overflow-y: auto;
    font-size: 12px;
  }
  h2 { font-size: 13px; font-weight: 600; color: #e0d8f0; margin: 16px 0 8px; letter-spacing: 0.5px; }
  h2:first-child { margin-top: 0; }
  .dim-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
  }
  .dim-label {
    width: 72px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    opacity: 0.6;
  }
  .pole-label {
    font-size: 9px;
    opacity: 0.4;
    width: 56px;
    text-align: center;
  }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #a090c0;
    cursor: pointer;
  }
  .value { width: 32px; text-align: right; font-size: 10px; opacity: 0.5; font-variant-numeric: tabular-nums; }
  .dissonance-bar {
    height: 3px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    margin: 4px 0 12px;
    overflow: hidden;
  }
  .dissonance-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .preset-row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .preset-btn {
    padding: 4px 10px;
    font-size: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #a090c0;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .preset-btn:hover { background: rgba(160,144,192,0.15); border-color: rgba(160,144,192,0.3); }
  .info { font-size: 10px; opacity: 0.35; line-height: 1.5; margin-top: 16px; }
</style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="sig"></canvas>
</div>

<div id="controls">
  <h2>NATAL (Baseline)</h2>
  <div id="natal-sliders"></div>

  <h2>QUIZ (Modulation)</h2>
  <div id="quiz-sliders"></div>

  <h2>DISSONANZ</h2>
  <div id="dissonance-display"></div>

  <h2>PRESETS</h2>
  <div class="preset-row">
    <button class="preset-btn" onclick="applyPreset('consonant')">Konsonant</button>
    <button class="preset-btn" onclick="applyPreset('dissonant')">Dissonant</button>
    <button class="preset-btn" onclick="applyPreset('fire')">Feuer-Typ</button>
    <button class="preset-btn" onclick="applyPreset('water')">Wasser-Typ</button>
    <button class="preset-btn" onclick="applyPreset('balanced')">Balanciert</button>
    <button class="preset-btn" onclick="applyPreset('extreme')">Extrem</button>
  </div>

  <p class="info">
    12 Pole (6 bipolare Dimensionspaare) bewegen sich und zeichnen Spuren.
    Die Spuren SIND die Signatur. Konsonanz = symmetrische Bahnen.
    Dissonanz = gegenläufige Kreuzung durch den Mittelpunkt.
  </p>
</div>

<script>
// ═══════════════════════════════════════
//  DIMENSIONS
// ═══════════════════════════════════════

const DIMENSIONS = [
  { id: 'assertion',  poleA: 'Durchsetzung', poleB: 'Hingabe',    baseAngle: 0,                   hz: 144.72, colorA: [255,38,31],   colorB: [173,140,255] },
  { id: 'empathy',    poleA: 'Einfühlung',   poleB: 'Abgrenzung', baseAngle: Math.PI/3,            hz: 210.42, colorA: [173,140,255], colorB: [97,133,184]  },
  { id: 'creativity', poleA: 'Schöpfung',    poleB: 'Struktur',   baseAngle: 2*Math.PI/3,          hz: 126.22, colorA: [255,184,31],  colorB: [51,242,255]  },
  { id: 'logic',      poleA: 'Analyse',      poleB: 'Synthese',   baseAngle: Math.PI,              hz: 141.27, colorA: [51,242,255],  colorB: [255,102,184] },
  { id: 'intuition',  poleA: 'Ahnung',       poleB: 'Evidenz',    baseAngle: 4*Math.PI/3,          hz: 183.58, colorA: [255,224,0],   colorB: [97,133,184]  },
  { id: 'discipline', poleA: 'Ordnung',      poleB: 'Freiheit',   baseAngle: 5*Math.PI/3,          hz: 147.85, colorA: [97,133,184],  colorB: [255,224,0]   },
];

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════

const natal = {};
const quiz = {};
DIMENSIONS.forEach(d => { natal[d.id] = 0.5; quiz[d.id] = 0.5; });

const canvas = document.getElementById('sig');
const ctx = canvas.getContext('2d');
let W, H, maxR, cx, cy;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  const size = Math.min(wrap.clientWidth, wrap.clientHeight) * 0.85;
  W = H = Math.round(size);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  maxR = W * 0.4;
  cx = W / 2;
  cy = H / 2;
  // Reinitialize poles on resize
  initPoles();
}

// ═══════════════════════════════════════
//  POLES
// ═══════════════════════════════════════

const MAX_TRAIL = 3000;
let poles = [];

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function hash01(s, k) { return ((Math.sin(s * 12.9898 + k * 78.233) * 43758.5453123) % 1 + 1) % 1; }
function logNormHz(f) {
  const lo = Math.log(100), hi = Math.log(300);
  return clamp((Math.log(f) - lo) / (hi - lo), 0, 1);
}

function initPoles() {
  poles = [];
  for (const dim of DIMENSIONS) {
    const nv = natal[dim.id];
    const qv = quiz[dim.id];
    const hzN = logNormHz(dim.hz);
    const baseR = maxR * lerp(0.25, 0.75, nv);
    const baseSpeed = 0.003 + hzN * 0.008;

    for (const pole of ['A', 'B']) {
      const off = pole === 'A' ? 0 : Math.PI;
      const rMod = pole === 'A' ? 1.0 : lerp(0.7, 1.3, qv);
      const sMod = pole === 'A' ? 1.0 : lerp(0.8, 1.2, 1 - qv);
      poles.push({
        dimId: dim.id,
        pole,
        theta: dim.baseAngle + off,
        radius: baseR * rMod,
        speed: baseSpeed * sMod,
        trail: [],
        x: 0, y: 0,
      });
    }
  }
}

// ═══════════════════════════════════════
//  DISSONANCE
// ═══════════════════════════════════════

function computeDissonance() {
  const dim = {};
  let total = 0;
  for (const d of DIMENSIONS) {
    const dev = Math.abs(quiz[d.id] - natal[d.id]);
    dim[d.id] = dev;
    total += dev;
  }
  return {
    dimensional: dim,
    dNatal: clamp(total / DIMENSIONS.length / 0.5, 0, 1),
    elementalQuality: 0,
  };
}

// ═══════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════

let time = 0;

function update() {
  const diss = computeDissonance();
  time += 0.016;

  for (let i = 0; i < poles.length; i += 2) {
    const pA = poles[i];
    const pB = poles[i+1];
    const dimIdx = i / 2;
    const dim = DIMENSIONS[dimIdx];
    const d = diss.dimensional[dim.id];

    pA.theta += pA.speed;
    pB.theta += pB.speed;

    // Symmetric (consonant)
    const sAx = Math.cos(pA.theta) * pA.radius;
    const sAy = Math.sin(pA.theta) * pA.radius;
    const sBx = Math.cos(pB.theta + Math.PI) * pB.radius;
    const sBy = Math.sin(pB.theta + Math.PI) * pB.radius;

    // Lissajous (dissonant)
    const fRatio = 1 + hash01(dim.hz, 3) * 2;
    const lAx = Math.cos(pA.theta) * pA.radius;
    const lAy = Math.sin(pA.theta * fRatio) * pA.radius;
    const lBx = Math.cos(pB.theta + Math.PI) * pB.radius;
    const lBy = Math.sin(pB.theta * fRatio + Math.PI) * pB.radius;

    const blend = clamp(d * 2, 0, 1);
    pA.x = lerp(sAx, lAx, blend);
    pA.y = lerp(sAy, lAy, blend);
    pB.x = lerp(sBx, lBx, blend);
    pB.y = lerp(sBy, lBy, blend);

    // Vibration on dissonance
    if (d > 0.1) {
      const vAmp = d * maxR * 0.03;
      const vFreq = diss.elementalQuality < 0 ? 12 : 3;
      const v = Math.sin(time * vFreq + dim.baseAngle) * vAmp;
      const pAngleA = pA.theta + Math.PI/2;
      pA.x += Math.cos(pAngleA) * v;
      pA.y += Math.sin(pAngleA) * v;
      pB.x += Math.cos(pAngleA) * -v;
      pB.y += Math.sin(pAngleA) * -v;
    }

    // Record trail
    pA.trail.push(pA.x, pA.y);
    pB.trail.push(pB.x, pB.y);
    if (pA.trail.length > MAX_TRAIL * 2) pA.trail.splice(0, 2);
    if (pB.trail.length > MAX_TRAIL * 2) pB.trail.splice(0, 2);
  }

  return diss;
}

// ═══════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════

function render() {
  const diss = update();

  // Fade — slower fade = longer persistence. More dissonance = faster clear
  const fadeAlpha = 0.015 + diss.dNatal * 0.025;
  ctx.fillStyle = `rgba(8, 5, 15, ${fadeAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // Subtle axis lines
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 0.5;
  for (const dim of DIMENSIONS) {
    const len = maxR * 0.92;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(dim.baseAngle) * len, cy + Math.sin(dim.baseAngle) * len);
    ctx.lineTo(cx + Math.cos(dim.baseAngle + Math.PI) * len, cy + Math.sin(dim.baseAngle + Math.PI) * len);
    ctx.stroke();
  }

  // Additive blending for trail overlap → brightness accumulates
  ctx.globalCompositeOperation = 'lighter';

  for (let i = 0; i < poles.length; i++) {
    const p = poles[i];
    const dimIdx = Math.floor(i / 2);
    const dim = DIMENSIONS[dimIdx];
    const color = p.pole === 'A' ? dim.colorA : dim.colorB;
    const [r, g, b] = color;

    // Full trail (very faint)
    if (p.trail.length >= 4) {
      ctx.beginPath();
      ctx.moveTo(cx + p.trail[0], cy + p.trail[1]);
      for (let j = 2; j < p.trail.length; j += 2) {
        ctx.lineTo(cx + p.trail[j], cy + p.trail[j+1]);
      }
      ctx.strokeStyle = `rgba(${r},${g},${b},0.06)`;
      ctx.lineWidth = 0.4;
      ctx.stroke();
    }

    // Recent trail (brighter)
    const recent = Math.min(160, p.trail.length / 2);
    const startJ = Math.max(0, p.trail.length - recent * 2);
    if (recent > 1) {
      ctx.beginPath();
      ctx.moveTo(cx + p.trail[startJ], cy + p.trail[startJ + 1]);
      for (let j = startJ + 2; j < p.trail.length; j += 2) {
        ctx.lineTo(cx + p.trail[j], cy + p.trail[j+1]);
      }
      ctx.strokeStyle = `rgba(${r},${g},${b},0.25)`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    // Pole head glow
    const d = diss.dimensional[dim.id];
    const glowR = 6 + d * 14;
    const grad = ctx.createRadialGradient(cx + p.x, cy + p.y, 0, cx + p.x, cy + p.y, glowR);
    grad.addColorStop(0, `rgba(${r},${g},${b},0.7)`);
    grad.addColorStop(0.4, `rgba(${r},${g},${b},0.15)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx + p.x, cy + p.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Core dot
    ctx.fillStyle = `rgba(${r},${g},${b},0.95)`;
    ctx.beginPath();
    ctx.arc(cx + p.x, cy + p.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';

  // Center
  const cGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 10);
  cGrad.addColorStop(0, 'rgba(0,0,0,0.7)');
  cGrad.addColorStop(0.4, 'rgba(15,10,25,0.3)');
  cGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, 10, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(render);
}

// ═══════════════════════════════════════
//  UI: SLIDERS
// ═══════════════════════════════════════

function buildSliders() {
  const natalDiv = document.getElementById('natal-sliders');
  const quizDiv = document.getElementById('quiz-sliders');

  for (const dim of DIMENSIONS) {
    // Natal slider
    natalDiv.appendChild(makeSliderRow(dim, 'natal'));
    // Quiz slider
    quizDiv.appendChild(makeSliderRow(dim, 'quiz'));
  }

  updateDissonanceDisplay();
}

function makeSliderRow(dim, type) {
  const row = document.createElement('div');
  row.className = 'dim-row';

  const label = document.createElement('span');
  label.className = 'dim-label';
  label.textContent = dim.id;

  const poleALabel = document.createElement('span');
  poleALabel.className = 'pole-label';
  poleALabel.textContent = dim.poleA;

  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = '0';
  slider.max = '100';
  slider.value = type === 'natal' ? natal[dim.id] * 100 : quiz[dim.id] * 100;

  const poleBLabel = document.createElement('span');
  poleBLabel.className = 'pole-label';
  poleBLabel.textContent = dim.poleB;

  const val = document.createElement('span');
  val.className = 'value';
  val.textContent = (slider.value / 100).toFixed(2);

  slider.addEventListener('input', () => {
    const v = slider.value / 100;
    if (type === 'natal') natal[dim.id] = v;
    else quiz[dim.id] = v;
    val.textContent = v.toFixed(2);
    // Reinit poles to reflect new weights
    initPoles();
    updateDissonanceDisplay();
  });

  row.appendChild(label);
  row.appendChild(poleALabel);
  row.appendChild(slider);
  row.appendChild(poleBLabel);
  row.appendChild(val);
  return row;
}

function updateDissonanceDisplay() {
  const diss = computeDissonance();
  const div = document.getElementById('dissonance-display');
  div.innerHTML = '';

  // Global
  const globalRow = document.createElement('div');
  globalRow.className = 'dim-row';
  const gLabel = document.createElement('span');
  gLabel.className = 'dim-label';
  gLabel.textContent = 'GLOBAL';
  globalRow.appendChild(gLabel);
  const gBar = document.createElement('div');
  gBar.className = 'dissonance-bar';
  gBar.style.flex = '1';
  const gFill = document.createElement('div');
  gFill.className = 'dissonance-fill';
  gFill.style.width = (diss.dNatal * 100) + '%';
  gFill.style.background = diss.dNatal > 0.5
    ? `linear-gradient(90deg, #ff6644, #ff2211)`
    : `linear-gradient(90deg, #6644aa, #ff6644)`;
  gBar.appendChild(gFill);
  globalRow.appendChild(gBar);
  const gVal = document.createElement('span');
  gVal.className = 'value';
  gVal.textContent = diss.dNatal.toFixed(2);
  globalRow.appendChild(gVal);
  div.appendChild(globalRow);

  // Per dimension
  for (const dim of DIMENSIONS) {
    const d = diss.dimensional[dim.id];
    const row = document.createElement('div');
    row.className = 'dim-row';
    const label = document.createElement('span');
    label.className = 'dim-label';
    label.textContent = dim.id;
    row.appendChild(label);
    const bar = document.createElement('div');
    bar.className = 'dissonance-bar';
    bar.style.flex = '1';
    const fill = document.createElement('div');
    fill.className = 'dissonance-fill';
    fill.style.width = (d / 0.5 * 100) + '%';
    fill.style.background = `rgba(${dim.colorA[0]},${dim.colorA[1]},${dim.colorA[2]},0.7)`;
    bar.appendChild(fill);
    row.appendChild(bar);
    const val = document.createElement('span');
    val.className = 'value';
    val.textContent = d.toFixed(2);
    row.appendChild(val);
    div.appendChild(row);
  }
}

// ═══════════════════════════════════════
//  PRESETS
// ═══════════════════════════════════════

const PRESETS = {
  consonant: {
    natal: { assertion: 0.7, empathy: 0.5, creativity: 0.6, logic: 0.4, intuition: 0.6, discipline: 0.5 },
    quiz:  { assertion: 0.7, empathy: 0.5, creativity: 0.6, logic: 0.4, intuition: 0.6, discipline: 0.5 },
  },
  dissonant: {
    natal: { assertion: 0.8, empathy: 0.3, creativity: 0.7, logic: 0.2, intuition: 0.6, discipline: 0.4 },
    quiz:  { assertion: 0.2, empathy: 0.8, creativity: 0.2, logic: 0.9, intuition: 0.2, discipline: 0.8 },
  },
  fire: {
    natal: { assertion: 0.9, empathy: 0.3, creativity: 0.8, logic: 0.3, intuition: 0.7, discipline: 0.2 },
    quiz:  { assertion: 0.85, empathy: 0.35, creativity: 0.75, logic: 0.25, intuition: 0.65, discipline: 0.25 },
  },
  water: {
    natal: { assertion: 0.2, empathy: 0.9, creativity: 0.5, logic: 0.6, intuition: 0.8, discipline: 0.6 },
    quiz:  { assertion: 0.25, empathy: 0.85, creativity: 0.45, logic: 0.55, intuition: 0.75, discipline: 0.55 },
  },
  balanced: {
    natal: { assertion: 0.5, empathy: 0.5, creativity: 0.5, logic: 0.5, intuition: 0.5, discipline: 0.5 },
    quiz:  { assertion: 0.5, empathy: 0.5, creativity: 0.5, logic: 0.5, intuition: 0.5, discipline: 0.5 },
  },
  extreme: {
    natal: { assertion: 0.95, empathy: 0.05, creativity: 0.95, logic: 0.05, intuition: 0.95, discipline: 0.05 },
    quiz:  { assertion: 0.05, empathy: 0.95, creativity: 0.05, logic: 0.95, intuition: 0.05, discipline: 0.95 },
  },
};

function applyPreset(name) {
  const preset = PRESETS[name];
  if (!preset) return;

  for (const [k, v] of Object.entries(preset.natal)) natal[k] = v;
  for (const [k, v] of Object.entries(preset.quiz)) quiz[k] = v;

  // Update slider UI
  const allSliders = document.querySelectorAll('input[type="range"]');
  let idx = 0;
  for (const dim of DIMENSIONS) {
    allSliders[idx].value = natal[dim.id] * 100;
    allSliders[idx].nextElementSibling.nextElementSibling.textContent = natal[dim.id].toFixed(2);
    idx++;
  }
  for (const dim of DIMENSIONS) {
    allSliders[idx].value = quiz[dim.id] * 100;
    allSliders[idx].nextElementSibling.nextElementSibling.textContent = quiz[dim.id].toFixed(2);
    idx++;
  }

  initPoles();
  updateDissonanceDisplay();
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════

window.addEventListener('resize', resize);
resize();
buildSliders();
requestAnimationFrame(render);
</script>
</body>
</html>
